
name: Creer un APK Android

on:
  push:
    branches:
      - principal
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construire Shearing France
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verifier le SDK Android
        run: |
          echo "SDK Android : $ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Installer les composants Android
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verifier les fichiers du projet
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -d www

      - name: Installer les dependances
        run: npm install

      - name: Ajouter Android
        run: npx cap add android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Compiler APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Shearing-France-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
