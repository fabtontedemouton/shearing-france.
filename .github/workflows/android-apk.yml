
name: Shearing France - Build APK

on:
  push:
    branches:
      - principal
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construire APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verifier le SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools"

      - name: Installer les composants Android
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verifier le projet
        run: |
          test -f package.json || (echo "package.json manquant à la racine" && exit 1)
          test -f capacitor.config.json || (echo "capacitor.config.json manquant" && exit 1)
          test -d www || (echo "Dossier www manquant" && exit 1)

      - name: Installer les dependances
        run: npm install

      - name: Ajouter Android
        run: npx cap add android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Compiler APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: Shearing-France-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
